spring.application.name=PULSE-Backend

# Charge le fichier .env (racine du module) s'il existe. En Docker / recette / prod,
# les variables d'environnement du conteneur sont utilisees directement.
spring.config.import=optional:file:.env[.properties]

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pulse}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# update en local ; en recette/prod mettre validate (ou none) via JPA_DDL_AUTO
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Serveur ---
server.port=${SERVER_PORT:8080}

# --- Supabase ---
supabase.url=${SUPABASE_URL:}
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
supabase.secret-key=${SUPABASE_SECRET_KEY:}
supabase.jwks-url=${SUPABASE_JWKS_URL:}
